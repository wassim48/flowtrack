name: Backend CI

on:
  pull_request:
    paths:
      - "backend/flowtrack-api/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/flowtrack-api/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Maven tests (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/flowtrack-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/flowtrack-api/pom.xml

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Run test suite
        run: ./mvnw --batch-mode --no-transfer-progress test
