name: Backend CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flowtrack
          POSTGRES_USER: flowtrack
          POSTGRES_PASSWORD: ci_only
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U flowtrack -d flowtrack"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/flowtrack-api/pom.xml
      - name: Build and run tests
        working-directory: backend/flowtrack-api
        env:
          POSTGRES_PASSWORD: ci_only
        run: bash mvnw --batch-mode --no-transfer-progress clean verify
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/flowtrack-api/target/surefire-reports/TEST-*.xml
